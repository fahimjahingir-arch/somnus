[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "somnus"
version = "0.1.0"
description = "Transformer-based sleep staging from single-channel EEG (Sleep-EDF), with subject-level validation and calibration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2",
  "mne>=1.6",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "pyyaml>=6",
  "rich>=13",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
somnus = "somnus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["B008", "NPY002"]  # typer's Option()/Argument() defaults; global seeding is intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
